  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>

  <style>

      padding: 0;
      box-sizing: border-box;
    }
    html,
    body {
      width: 100%;
      /* FIX: Use min-height instead of height: 100% on html/body. 
         height: 100% prevents natural document scrolling on mobile 
         and breaks ScrollTrigger's scroll event detection. */
      min-height: 100%;
      overflow-x: hidden;
      background: #fff;
      font-family: Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      position: relative;
    }
    .section {
      position: relative;
      /* Scroll height for the sequence */
      height: 700vh;
      background: #fff;
    }
