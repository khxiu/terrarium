<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Terrarium Sequence</title>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,
body{
width:100%;
height:100%;
overflow-x:hidden;
background:#fff;
font-family:Arial,sans-serif;
-webkit-font-smoothing:antialiased;
}

body{
position:relative;
}

.section{

position:relative;

height:700vh;

background:#fff;

}

.sticky{

position:sticky;

top:0;

width:100%;

height:100vh;

height:100svh;

overflow:hidden;

background:#fff;

}

canvas{

position:absolute;

left:0;
top:0;

width:100%;
height:100%;

display:block;

background:#fff;

}

/* ---------------- Loading ---------------- */

#loading{

position:absolute;

left:50%;
top:50%;

transform:translate(-50%,-50%);

font-size:18px;

letter-spacing:.08em;

color:#777;

z-index:100;

transition:.3s;

}

#loading.hide{

opacity:0;

pointer-events:none;

}

/* ---------------- Hotspots ---------------- */

#hotspots{

position:absolute;

inset:0;

pointer-events:none;

opacity:0;

visibility:hidden;

z-index:5;

}

.hotspot{

position:absolute;

display:flex;

align-items:center;

gap:12px;

color:#5f564d;

font-size:18px;

white-space:nowrap;

opacity:0;

}

.line{

width:120px;

height:1px;

background:#5f564d;

transform-origin:left center;

transform:scaleX(0);

}

.circle{

width:10px;

height:10px;

border-radius:50%;

border:1px solid #5f564d;

transform:scale(0);

}

#h1{

left:60%;

top:30%;

}

#h2{

left:60%;

top:44%;

}

#h3{

left:60%;

top:57%;

}

/* ---------------- Tablet ---------------- */

@media(max-width:991px){

.hotspot{

font-size:15px;

gap:10px;

}

.line{

width:70px;

}

#h1,
#h2,
#h3{

left:56%;

}

}

/* ---------------- Phone ---------------- */

@media(max-width:768px){

.hotspot{

font-size:12px;

gap:8px;

}

.line{

width:45px;

}

.circle{

width:8px;

height:8px;

}

#h1{

left:51%;

top:34%;

}

#h2{

left:51%;

top:48%;

}

#h3{

left:51%;

top:60%;

}

}

</style>

</head>

<body>

<section class="section">

<div class="sticky">

<div id="loading">

Loading 0%

</div>

<canvas id="sequence"></canvas>

<div id="hotspots">

<div class="hotspot" id="h1">

<div class="line"></div>

<div class="circle"></div>

<div>Bol Moss</div>

</div>

<div class="hotspot" id="h2">

<div class="line"></div>

<div class="circle"></div>

<div>Sphagnum Moss</div>

</div>

<div class="hotspot" id="h3">

<div class="line"></div>

<div class="circle"></div>

<div>Drainage Stones</div>

</div>

</div>

</div>

</section>

<script>

gsap.registerPlugin(ScrollTrigger);

ScrollTrigger.config({
ignoreMobileResize:true
});

const canvas=document.getElementById("sequence");

const ctx=canvas.getContext("2d");

const loading=document.getElementById("loading");

const hotspotLayer=document.getElementById("hotspots");

const TOTAL=101;

const images=[];

const loaded=[];

let loadedCount=0;

let currentFrame=0;

let renderedFrame=-1;

let hotspotsVisible=false;

/* ----------------
Viewport
---------------- */

let viewWidth=window.innerWidth;

let viewHeight=window.innerHeight;

let dpr=Math.min(window.devicePixelRatio||1,2);

function updateViewport(){

viewWidth=window.innerWidth;

viewHeight=window.visualViewport
?window.visualViewport.height
:window.innerHeight;

canvas.width=viewWidth*dpr;

canvas.height=viewHeight*dpr;

canvas.style.width=viewWidth+"px";

canvas.style.height=viewHeight+"px";

ctx.setTransform(dpr,0,0,dpr,0,0);

}

updateViewport();

/* ----------------
Image Path
---------------- */

function frameURL(i){

return "./ezgif-frame-"+String(i).padStart(3,"0")+".png";

}
/* ----------------
Image Preloader
---------------- */

function updateLoading(){

const percent=Math.round((loadedCount/TOTAL)*100);

loading.textContent="Loading "+percent+"%";

if(loadedCount===TOTAL){

loading.classList.add("hide");

}

}

function preloadImages(){

for(let i=1;i<=TOTAL;i++){

const img=new Image();

img.onload=function(){

loaded[i-1]=true;

loadedCount++;

updateLoading();

/* draw first frame immediately */

if(i===1){

drawFrame(0);

}

};

img.onerror=function(){

console.warn("Missing:",frameURL(i));

loaded[i-1]=false;

loadedCount++;

updateLoading();

};

img.src=frameURL(i);

images.push(img);

}

}

preloadImages();

/* ----------------
Find nearest loaded frame
---------------- */

function nearestFrame(index){

if(loaded[index]) return index;

/* search backwards first */

for(let i=index;i>=0;i--){

if(loaded[i]) return i;

}

/* then forwards */

for(let i=index;i<TOTAL;i++){

if(loaded[i]) return i;

}

return -1;

}

/* ----------------
Draw Frame
---------------- */

function drawFrame(frame){

frame=Math.round(frame);

frame=Math.max(0,Math.min(frame,TOTAL-1));

const index=nearestFrame(frame);

if(index===-1) return;

const img=images[index];

if(!img.complete) return;

ctx.clearRect(0,0,viewWidth,viewHeight);

/* ---------- */

/* COVER instead of CONTAIN

This fills the screen better on
desktop & mobile.

*/

const scale=Math.max(

viewWidth/img.naturalWidth,

viewHeight/img.naturalHeight

);

const drawWidth=img.naturalWidth*scale;

const drawHeight=img.naturalHeight*scale;

/* ---------- */

/*

Vertical offset.

Adjust ONLY this value later
if you want the terrarium
slightly higher/lower.

*/

const offsetY=

window.innerWidth<768

?40

:20;

const drawX=(viewWidth-drawWidth)/2;

const drawY=((viewHeight-drawHeight)/2)+offsetY;

/* ---------- */

ctx.drawImage(

img,

drawX,

drawY,

drawWidth,

drawHeight

);

renderedFrame=index;

/* ---------- */

if(frame===TOTAL-1){

showHotspots();

}else{

hideHotspots();

}

}

/* ----------------
Animation State
---------------- */

const state={

frame:0

};
/* ----------------
Hotspots
---------------- */

function showHotspots(){

if(hotspotsVisible) return;

hotspotsVisible=true;

hotspotLayer.style.visibility="visible";
hotspotLayer.style.opacity="1";

const items=document.querySelectorAll(".hotspot");

items.forEach((item,index)=>{

const line=item.querySelector(".line");
const circle=item.querySelector(".circle");
const text=item.children[2];

gsap.set(item,{
opacity:1
});

gsap.fromTo(
line,
{
scaleX:0
},
{
scaleX:1,
duration:.45,
ease:"power2.out",
delay:index*.15
});

gsap.fromTo(
circle,
{
scale:0
},
{
scale:1,
duration:.18,
ease:"back.out(2)",
delay:.4+(index*.15)
});

gsap.fromTo(
text,
{
opacity:0,
x:-12
},
{
opacity:1,
x:0,
duration:.3,
ease:"power2.out",
delay:.55+(index*.15)
});

});

}

function hideHotspots(){

if(!hotspotsVisible) return;

hotspotsVisible=false;

gsap.killTweensOf(".hotspot");
gsap.killTweensOf(".line");
gsap.killTweensOf(".circle");
gsap.killTweensOf(".hotspot div:last-child");

gsap.set(".hotspot",{
opacity:0
});

gsap.set(".line",{
scaleX:0
});

gsap.set(".circle",{
scale:0
});

gsap.set(".hotspot div:last-child",{
opacity:0,
x:-12
});

hotspotLayer.style.opacity="0";
hotspotLayer.style.visibility="hidden";

}

/* ----------------
GSAP Sequence
---------------- */

gsap.to(state,{

frame:TOTAL-1,

ease:"none",

snap:{
frame:1
},

onUpdate:function(){

drawFrame(state.frame);

},

scrollTrigger:{

trigger:".section",

start:"top top",

end:"bottom bottom",

scrub:true,

pin:false,

invalidateOnRefresh:true,

markers:false,

onUpdate:self=>{

loading.textContent="Frame "+Math.round(state.frame);

}

}

});

/* ----------------
Resize
---------------- */

let resizeTimer;

window.addEventListener("resize",()=>{

clearTimeout(resizeTimer);

resizeTimer=setTimeout(()=>{

dpr=Math.min(window.devicePixelRatio||1,2);

updateViewport();

drawFrame(state.frame);

ScrollTrigger.refresh();

},150);

});

/* ----------------
Orientation
---------------- */

window.addEventListener("orientationchange",()=>{

setTimeout(()=>{

dpr=Math.min(window.devicePixelRatio||1,2);

updateViewport();

drawFrame(state.frame);

ScrollTrigger.refresh();

},300);

});
/* ----------------
Initial Render
---------------- */

function init(){

// Make sure the canvas size is correct
updateViewport();

// Draw the first frame if it's available
drawFrame(0);

// Force ScrollTrigger to calculate after layout
requestAnimationFrame(()=>{
ScrollTrigger.refresh();
});

}

if(document.readyState==="loading"){

document.addEventListener("DOMContentLoaded",init);

}else{

init();

}

/* ----------------
Prevent browser image dragging
---------------- */

document.addEventListener("dragstart",function(e){

e.preventDefault();

});

/* ----------------
Pause rendering when page hidden
---------------- */

document.addEventListener("visibilitychange",function(){

if(document.hidden){

gsap.ticker.sleep();

}else{

gsap.ticker.wake();

drawFrame(state.frame);

}

});

/* ----------------
Optional Debug
(Set to true if needed)
---------------- */

const DEBUG=false;

if(DEBUG){

ScrollTrigger.addEventListener("refresh",()=>{

console.log(
"Viewport:",
viewWidth,
viewHeight,
"Frame:",
Math.round(state.frame)
);

});

}

/* ----------------
End
---------------- */

</script>

</body>

</html>
