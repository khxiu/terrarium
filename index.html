<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terrarium Sequence</title>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  overflow-x: hidden;
  background: #ffffff;
  font-family: Arial, sans-serif;
}

.section {
  height: 700vh;
}

.sticky {
  position: sticky;
  top: 0;
  width: 100%;
  height: 100vh;
  height: 100svh;
  overflow: hidden;
  background: #ffffff;
}

canvas {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  background: #ffffff;
}

#hotspots {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
}

.hotspot {
  position: absolute;
  display: flex;
  align-items: center;
  gap: 12px;
  color: #5f564d;
  font-size: 18px;
  white-space: nowrap;
  opacity: 0;
}

.line {
  width: 120px;
  height: 1px;
  background: #5f564d;
  transform: scaleX(0);
  transform-origin: left center;
}

.circle {
  width: 10px;
  height: 10px;
  border: 1px solid #5f564d;
  border-radius: 50%;
  transform: scale(0);
}

#h1 {
  left: 60%;
  top: 30%;
}

#h2 {
  left: 60%;
  top: 44%;
}

#h3 {
  left: 60%;
  top: 56%;
}

@media (max-width: 768px) {
  .hotspot {
    gap: 8px;
    font-size: 13px;
  }

  .line {
    width: 50px;
  }

  #h1,
  #h2,
  #h3 {
    left: 52%;
  }
}
</style>
</head>

<body>

<section class="section">
  <div class="sticky">

    <canvas id="c"></canvas>

    <div id="hotspots">

      <div class="hotspot" id="h1">
        <div class="line"></div>
        <div class="circle"></div>
        <div>Bol Moss</div>
      </div>

      <div class="hotspot" id="h2">
        <div class="line"></div>
        <div class="circle"></div>
        <div>Sphagnum Moss</div>
      </div>

      <div class="hotspot" id="h3">
        <div class="line"></div>
        <div class="circle"></div>
        <div>Drainage Stones</div>
      </div>

    </div>

  </div>
</section>

<script>
gsap.registerPlugin(ScrollTrigger);

var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var hotspotLayer = document.getElementById("hotspots");

var TOTAL = 101;
var state = {
  frame: 0
};

var images = new Array(TOTAL);
var loaded = new Array(TOTAL);

var targetFrame = 0;
var lastDrawnFrame = -1;
var hotspotsVisible = false;

var canvasCssWidth = 0;
var canvasCssHeight = 0;
var canvasDpr = 1;

for (var loadedIndex = 0; loadedIndex < TOTAL; loadedIndex++) {
  loaded[loadedIndex] = false;
}

/*
Creates:
./ezgif-frame-001.png
./ezgif-frame-002.png
...
./ezgif-frame-101.png
*/
function getFramePath(frameNumber) {
  var paddedNumber = ("000" + frameNumber).slice(-3);

  return "./ezgif-frame-" + paddedNumber + ".png";
}

function loadFrame(index) {
  var img = new Image();

  images[index] = img;

  img.onload = function () {
    loaded[index] = true;

    if (index === 0 || index === targetFrame) {
      drawFrame(targetFrame);
    }
  };

  img.onerror = function () {
    console.error(
      "Could not load image: " + getFramePath(index + 1)
    );
  };

  img.src = getFramePath(index + 1);
}

for (var imageIndex = 0; imageIndex < TOTAL; imageIndex++) {
  loadFrame(imageIndex);
}

function resizeCanvas() {
  var width = canvas.clientWidth || window.innerWidth;
  var height = canvas.clientHeight || window.innerHeight;
  var dpr = Math.min(window.devicePixelRatio || 1, 1.5);

  var requiredWidth = Math.round(width * dpr);
  var requiredHeight = Math.round(height * dpr);

  if (
    canvas.width !== requiredWidth ||
    canvas.height !== requiredHeight
  ) {
    canvas.width = requiredWidth;
    canvas.height = requiredHeight;
  }

  canvasCssWidth = width;
  canvasCssHeight = height;
  canvasDpr = dpr;

  ctx.setTransform(
    canvasDpr,
    0,
    0,
    canvasDpr,
    0,
    0
  );
}

/*
If the requested image has not
finished loading,
keep displaying the last valid image instead of
clearing the canvas and showing a blank screen.
*/
function getAvailableFrame(requestedFrame) {
  if (loaded[requestedFrame]) {
    return requestedFrame;
  }

  if (
    lastDrawnFrame >= 0 &&
    loaded[lastDrawnFrame]
  ) {
    return lastDrawnFrame;
  }

  for (var distance = 1; distance < TOTAL; distance++) {
    var lowerFrame = requestedFrame - distance;
    var upperFrame = requestedFrame + distance;

    if (
      lowerFrame >= 0 &&
      loaded[lowerFrame]
    ) {
      return lowerFrame;
    }

    if (
      upperFrame < TOTAL &&
      loaded[upperFrame]
    ) {
      return upperFrame;
    }
  }

  return -1;
}

function drawFrame(frameNumber) {
  targetFrame = Math.round(frameNumber);

  if (targetFrame < 0) {
    targetFrame = 0;
  }

  if (targetFrame > TOTAL - 1) {
    targetFrame = TOTAL - 1;
  }

  var availableFrame = getAvailableFrame(targetFrame);

  if (availableFrame === -1) {
    return;
  }

  var img = images[availableFrame];

  if (
    !img ||
    !img.naturalWidth ||
    !img.naturalHeight
  ) {
    return;
  }

  resizeCanvas();

  ctx.clearRect(
    0,
    0,
    canvasCssWidth,
    canvasCssHeight
  );

  var scale = Math.min(
    canvasCssWidth / img.naturalWidth,
    canvasCssHeight / img.naturalHeight
  );

  var drawWidth = img.naturalWidth * scale;
  var drawHeight = img.naturalHeight * scale;

  var drawX =
    (canvasCssWidth - drawWidth) / 2;

  var drawY =
    (canvasCssHeight - drawHeight) / 2;

  ctx.drawImage(
    img,
    drawX,
    drawY,
    drawWidth,
    drawHeight
  );

  lastDrawnFrame = availableFrame;

  /*
  Hotspots appear only when the scroll reaches
  ezgif-frame-101.png.
  */
  if (
    targetFrame === TOTAL - 1 &&
    loaded[TOTAL - 1]
  ) {
    showHotspots();
  } else {
    hideHotspots();
  }
}

function showHotspots() {
  if (hotspotsVisible) {
    return;
  }

  hotspotsVisible = true;

  hotspotLayer.style.visibility = "visible";
  hotspotLayer.style.opacity = "1";

  var hotspotElements =
    document.querySelectorAll(".hotspot");

  for (
    var i = 0;
    i < hotspotElements.length;
    i++
  ) {
    var element = hotspotElements[i];
    var delay = i * 0.15;

    gsap.set(element, {
      opacity: 1
    });

    gsap.fromTo(
      element.querySelector(".line"),
      {
        scaleX: 0
      },
      {
        scaleX: 1,
        duration: 0.4,
        delay: delay
      }
    );

    gsap.fromTo(
      element.querySelector(".circle"),
      {
        scale: 0
      },
      {
        scale: 1,
        duration: 0.15,
        delay: 0.4 + delay
      }
    );

    gsap.fromTo(
      element.children[2],
      {
        opacity: 0,
        x: -10
      },
      {
        opacity: 1,
        x: 0,
        duration: 0.3,
        delay: 0.55 + delay
      }
    );
  }
}

function hideHotspots() {
  if (!hotspotsVisible) {
    return;
  }

  hotspotsVisible = false;

  gsap.killTweensOf(".hotspot");
  gsap.killTweensOf(".line");
  gsap.killTweensOf(".circle");
  gsap.killTweensOf(
    ".hotspot div:last-child"
  );

  gsap.set(".hotspot", {
    opacity: 0
  });

  gsap.set(".line", {
    scaleX: 0
  });

  gsap.set(".circle", {
    scale: 0
  });

  gsap.set(
    ".hotspot div:last-child",
    {
      opacity: 0,
      x: -10
    }
  );

  hotspotLayer.style.opacity = "0";
  hotspotLayer.style.visibility = "hidden";
}

gsap.to(state, {
  frame: TOTAL - 1,
  ease: "none",

  snap: {
    frame: 1
  },

  onUpdate: function () {
    drawFrame(state.frame);
  },

  scrollTrigger: {
    trigger: ".section",
    start: "top top",
    end: "bottom bottom",
    scrub: 0.5,
    invalidateOnRefresh: true
  }
});

var resizeTimer;

window.addEventListener(
  "resize",
  function () {
    clearTimeout(resizeTimer);

    resizeTimer = setTimeout(
      function () {
        resizeCanvas();
        drawFrame(targetFrame);
      },
      100
    );
  }
);

window.addEventListener(
  "orientationchange",
  function () {
    setTimeout(
      function () {
        resizeCanvas();
      drawFrame(targetFrame);
        ScrollTrigger.refresh();
      },
      250
    );
  }
);
</script>

</body>
</html>
